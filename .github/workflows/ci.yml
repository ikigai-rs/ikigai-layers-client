name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Gates (ruff check · ruff format --check · pytest)
        # The same script `just gates` runs locally. The interop tests skip here (no Rust
        # host); the `interop` job below runs them.
        run: scripts/gates.sh python

  interop:
    # The `ikigai-layers` command against a REAL Rust layer door (tests/test_interop.py):
    # ikigai-cli built from crates.io with its `quic` feature, `--locked` (the lock it was
    # published with), cached by version so only a version bump rebuilds it.
    # `--require-interop` turns a missing binary into a FAILURE: a skipped interop suite
    # would pass green while covering nothing.
    runs-on: ubuntu-latest
    env:
      IKIGAI_CLI_VERSION: "0.1.62"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache the ikigai binary
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/ikigai
          key: ikigai-cli-${{ env.IKIGAI_CLI_VERSION }}-quic-${{ runner.os }}
      - name: Build ikigai-cli (quic)
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install ikigai-cli --version "$IKIGAI_CLI_VERSION" --locked --features quic
      - name: Put the binary on PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/ikigai" --version
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Interop (ikigai-layers against a local Rust layer door)
        run: python -m pytest -q --require-interop tests/test_interop.py
